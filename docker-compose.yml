version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/nba_bet_insights.db
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production-32chars!}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-32!}
      - ABACUS_API_KEY=${ABACUS_API_KEY:-}
      - ABACUS_API_URL=${ABACUS_API_URL:-https://apps.abacus.ai/api/v0}
      - SCRAPER_USER_AGENT=Mozilla/5.0
      - RATE_LIMIT_RPM=100
      - APP_ENV=development
      - APP_PORT=8080
      - ALLOWED_ORIGINS=http://localhost:3000
      - ODDS_API_KEY=${ODDS_API_KEY:-}
      - ODDS_API_URL=https://api.the-odds-api.com/v4
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
